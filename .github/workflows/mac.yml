name: Mac build

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
          cd ~/vcpkg && git checkout 15e5f3820f0370f1ba7150853762cec0688cd396
          ~/vcpkg/bootstrap-vcpkg.sh

      - name: Install dependencies
        run: |
          ~/vcpkg/vcpkg install \
            duckdb \
            glew \
            glfw3 \
            glm \
            imgui[glfw-binding,opengl3-binding] \
            portable-file-dialogs \
            stb \
            zlib \
            --triplet arm64-osx

      - name: Build
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=~/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Zip
        run: |
          mkdir -p artifacts
          cp build/AggieXLMA artifacts/
          zip -r AggieXLMA-mac.zip artifacts/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AggieXLMA-mac
          path: AggieXLMA-mac.zip
          retention-days: 7